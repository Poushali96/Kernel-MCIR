[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-mcir"
version = "0.1.0"
description = "Anonymous reproducibility implementation of Kernel-MCIR"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
